version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: accounting_db
    environment:
      POSTGRES_DB: accounting_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    image: maven:3.9.6-eclipse-temurin-21-jammy
    container_name: accounting_backend
    working_dir: /app
    volumes:
      - .:/app
      - ./uploads:/app/uploads # Lưu trữ hợp đồng PDF bền vững
      - ~/.m2:/root/.m2 # Cache maven dependencies locally
    depends_on:
      - postgres-db
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/accounting_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
    ports:
      - "8888:8888"
    command: mvn spring-boot:run
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: accounting_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules # Don't overwrite node_modules from host
    depends_on:
      - backend
    ports:
      - "5173:5173"
      - "3000:3000" # Map host 3000 to container 3000 where Vite is running
    environment:
      - API_PROXY_TARGET=http://backend:8888
    command: sh -c "npm install && npm run dev"
    restart: unless-stopped

volumes:
  postgres_data:
