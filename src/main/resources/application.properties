# Spring Boot Configuration
spring.application.name=Accounting App
server.port=8888
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=accounting_db;encrypt=true;trustServerCertificate=true}
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=sa
spring.datasource.password=AccountingApp@123
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# HikariCP settings
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=AccountingHikariPool

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.use_nationalized_character_data=true

# Logging
logging.level.org.springframework=INFO
logging.level.com.accounting.app=DEBUG

# JWT Configuration
app.jwtSecret=accountingSecretKey1234567890qwertyuiopasdfghjklzxcvbnm!@#$%^&*()
app.jwtExpirationMs=86400000
